<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- MacaroniGraph mark: a play triangle that becomes lines of text (video → knowledge). Original artwork. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#shine)"/>
  <!-- play triangle -->
  <path d="M28 36 Q28 30 33.5 33 L70 58 Q75 61.5 70 65 L33.5 90 Q28 93 28 87 Z" fill="#fff"/>
  <!-- text lines emerging from the triangle tip -->
  <rect x="78" y="44" width="26" height="9" rx="4.5" fill="#fff" opacity=".95"/>
  <rect x="78" y="58" width="20" height="9" rx="4.5" fill="#fff" opacity=".8"/>
  <rect x="78" y="72" width="26" height="9" rx="4.5" fill="#fff" opacity=".65"/>
</svg>
